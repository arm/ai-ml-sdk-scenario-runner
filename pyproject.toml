[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_ml_sdk_scenario_runner"
description = "ML SDK Scenario Runner"
readme = "README.md"
dynamic = ["version"]
license = { text = "Apache-2.0" }
authors = [
    { name = "Arm Limited" }
]
requires-python = ">=3.8"

[project.scripts]
scenario_runner = "scenario_runner.cli:main"
scenario-runner = "scenario_runner.cli:main"

[tool.setuptools]
package-dir = { "" = "pip_package" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["pip_package"]

[tool.setuptools.package-data]
scenario_runner = ["binaries/**"]

[tool.setuptools_scm]
fallback_version = "0.11.0"

[tool.black]
target-version = ['py310']

[tool.pytest.ini_options]
markers = [
    "shaders",
    "pipeline_cache",
    "mark_boundary",
    "tensor_aliasing",
    "memory_aliasing",
    "dds",
    "barrier",
    "mipmaps_writing",
    "vgf_graph",
    "vgf_shader",
    "shader_and_vgf_graph",
    "tiling",
    "spec_const",
    "repeated_runs",
    "png",
    "optical_flow",
]
